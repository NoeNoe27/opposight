<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="Opposight Sales: drops, orders, profit and production calendar for Myanmar, Thailand and USA."><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}html[data-custom] .tabs button[aria-selected="true"]{background:var(--sel-bg);color:var(--sel-ink)}
html[data-custom] .chip[aria-pressed="true"],html[data-custom] .modetabs button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bg)}
html[data-custom] .modetabs button[aria-pressed="true"] small{color:var(--sel-ink);opacity:.7}

/* ================= v7: full-frame glow, country colours, pop-up rows, text settings ================= */
html{background:var(--canvas);min-height:100%}
:root[data-glow="sky"]{--g1:rgba(125,211,252,.46);--g2:rgba(56,189,248,.28);--g3:rgba(186,230,253,.50)}
:root[data-glow="sky"][data-theme="dark"]{--g1:rgba(14,165,233,.30);--g2:rgba(56,189,248,.20);--g3:rgba(2,132,199,.24)}
.bgfx{width:100vw;height:100vh;height:100lvh;min-height:100%}
.bgfx::before,.bgfx::after,.bgfx i{border-radius:0;width:auto;height:auto}
.bgfx::before{inset:-20%;background:radial-gradient(55% 45% at 18% 14%,var(--g1) 0%,transparent 72%),radial-gradient(50% 42% at 86% 26%,var(--g2) 0%,transparent 72%),radial-gradient(65% 50% at 50% 55%,var(--g3) 0%,transparent 76%);animation:glowFull 24s ease-in-out infinite alternate}
.bgfx::after{inset:-20%;background:radial-gradient(55% 45% at 14% 88%,var(--g2) 0%,transparent 72%),radial-gradient(55% 45% at 88% 84%,var(--g1) 0%,transparent 72%);animation:glowFull2 30s ease-in-out infinite alternate}
.bgfx i{inset:-10%;background:radial-gradient(45% 35% at 50% 40%,var(--g3) 0%,transparent 72%);animation:glowFull 36s ease-in-out infinite alternate-reverse}
@keyframes glowFull{0%{transform:translate(-3%,-2%) scale(1)}100%{transform:translate(3%,3%) scale(1.08)}}
@keyframes glowFull2{0%{transform:translate(3%,2%) scale(1.04)}100%{transform:translate(-3%,-3%) scale(.97)}}
@media (prefers-reduced-motion:reduce){.bgfx::before,.bgfx::after,.bgfx i{animation:none}}
.sw-sky{background:radial-gradient(circle at 28% 30%,rgba(56,189,248,.75),transparent 62%),radial-gradient(circle at 76% 74%,rgba(186,230,253,.85),transparent 62%),var(--card-bg)!important}
/* country cards: colour wash + numbers that never wrap */
.cty .c{container-type:inline-size;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 16%,transparent) 0%,transparent 64%),var(--card-bg);transition:transform .2s ease,box-shadow .2s ease}
.cty .c:hover{transform:translateY(-2px);box-shadow:0 10px 24px -8px color-mix(in srgb,var(--cc) 55%,transparent)}
.cty .n{color:color-mix(in srgb,var(--cc) 70%,var(--ink))}
.cty .a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal;font-size:min(20px,17cqi)}
/* brand title / subtitle */
.brandrow{min-width:0;flex:1 1 auto}.brand{min-width:0;max-width:100%}
#brand-title,#tp-title{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
#brand-sub,#tp-sub{overflow:hidden;text-overflow:ellipsis}
[data-tc="sky"]{color:#0284C7}:root[data-theme="dark"] [data-tc="sky"]{color:#38BDF8}
[data-tc="grad"]{background:linear-gradient(90deg,#0284C7,#38BDF8 55%,#7DD3FC);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="dark"] [data-tc="grad"]{background-image:linear-gradient(90deg,#38BDF8,#7DD3FC 55%,#E0F2FE)}
/* tappable rows that open pop-ups */
.srows{display:grid;gap:8px}
.sgrp{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 2px 2px}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:18px;border:1px solid var(--glass-line);background:color-mix(in srgb,var(--card-bg) 86%,transparent);box-shadow:var(--shadow);color:var(--ink);font:inherit;cursor:pointer;min-height:56px;transition:transform .15s ease,border-color .2s ease,background-color .2s ease}
.srow:hover{border-color:color-mix(in srgb,#38BDF8 55%,transparent)}
.srow:active{transform:scale(.98)}
.srow .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,#38BDF8 16%,transparent);flex:0 0 auto}
.srow .st{flex:1;min-width:0;display:grid;gap:2px}.srow .st b{font-size:14px}
.srow .st small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sv{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.srow .sv.hot{background:color-mix(in srgb,#38BDF8 22%,transparent);color:var(--ink)}
.srow .chev{color:var(--muted);font-size:20px;line-height:1;flex:none;transition:transform .15s ease}
.srow:hover .chev{transform:translateX(2px)}
.shpop{display:flex;flex-direction:column;gap:12px}
.shbody>div:last-child{margin-bottom:0!important}
/* colour presets */
.ccgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:480px){.ccgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ccp{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--card-bg);text-align:left;cursor:pointer;display:grid;gap:8px;font:inherit;color:var(--ink);transition:transform .15s ease,border-color .2s ease,box-shadow .2s ease}
.ccp:active{transform:scale(.97)}
.ccp[aria-pressed="true"]{border-color:#0EA5E9;box-shadow:0 0 0 2px color-mix(in srgb,#0EA5E9 35%,transparent)}
.ccp .bars{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.ccp .bars i{height:24px;border-radius:8px;display:block}
.ccp b{font-size:12px}
.cc3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ccl{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.ccl input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--surface)}
/* sliders + preview */
.rngl{display:grid;gap:6px;font-size:12px;font-weight:600;color:var(--muted);margin-top:10px}
.rngl>span{display:flex;justify-content:space-between}.rngl b{color:var(--ink)}
.rng{width:100%;accent-color:#0EA5E9;height:28px}
.tprev{padding:16px;border-radius:16px;background:var(--soft);border:1px dashed var(--line);overflow:hidden}
.tprev .brand{font-size:24px}
/* attach-links */
.lkattach{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--soft);border:1px dashed color-mix(in srgb,#38BDF8 60%,var(--line));cursor:pointer;font:inherit;color:var(--ink);width:100%;text-align:left;transition:transform .15s ease,border-color .2s ease}
.lkattach:active{transform:scale(.98)}
.lkattach>span:first-child{display:grid;gap:2px;min-width:0}.lkattach small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lkattach .sv{font-size:12px;font-weight:700;white-space:nowrap;color:#0284C7}
:root[data-theme="dark"] .lkattach .sv{color:#38BDF8}
.lkpaste{display:grid;grid-template-columns:1fr auto;gap:8px}
.lkpaste input,.lkf input{font:500 16px var(--f-body);padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0;box-sizing:border-box}
.lkclip{justify-self:start}
.lkfields{display:grid;gap:8px}
.lkf{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.lktest{font:700 12px var(--f-body);padding:8px 10px;border-radius:999px;color:#fff;text-decoration:none}
#lkpop .calov{z-index:70}#lkpop .calpop{z-index:71}
</style></head><body>

<style>
/* Layout: one-screen app. Brand header / scrolling card / bottom tabs.
   Streetwear palette from the brand: off-white, black, signal yellow, red. One colour per country. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#111111; --muted:#777777; --line:#EEEEEE; --soft:#F6F6F6;
  --yellow:#FFD200; --red:#D93025; --blue:#2453C9;
  --mm:#111111; --mm-soft:#F6F6F6; --th:#111111; --th-soft:#F6F6F6; --us:#111111; --us-soft:#F6F6F6;
  --good:#1A7F4B; --good-soft:#EEF7F1; --warn-soft:#FFF8DD; --bad-soft:#FDEEEE;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E0E; --surface:#0E0E0E; --ink:#F2F2F2; --muted:#9A9A9A; --line:#242424; --soft:#181818;
  --mm:#F2F2F2; --mm-soft:#181818; --th:#F2F2F2; --th-soft:#181818; --us:#F2F2F2; --us-soft:#181818;
  --good:#4CC489; --good-soft:#12291D; --warn-soft:#2B2508; --bad-soft:#2E1414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --surface:#0E0E0E; --ink:#F2F2F2; --muted:#9A9A9A; --line:#242424; --soft:#181818;
  --mm:#F2F2F2; --mm-soft:#181818; --th:#F2F2F2; --th-soft:#181818; --us:#F2F2F2; --us-soft:#181818;
  --good:#4CC489; --good-soft:#12291D; --warn-soft:#2B2508; --bad-soft:#2E1414; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
.app{height:100%;max-width:600px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
@media (min-width:400px){.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
h1,h2,h3{margin:0;text-wrap:balance} p{margin:0}
button,input,select,textarea{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px;gap:10px}
.brandrow{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;flex:0 0 auto}
.brand{font-family:var(--f-display);font-size:24px;font-weight:400;letter-spacing:.04em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--muted);margin-top:3px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.busy{background:var(--yellow)} .dot.err{background:var(--red)}
.card{background:var(--surface);border:0;border-radius:0;padding-inline:0 !important;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;min-height:0;padding:16px;display:flex;flex-direction:column;gap:14px}
.card>*{flex-shrink:0}
.h2{font-family:var(--f-display);font-size:26px;font-weight:400;line-height:1.05;text-transform:uppercase;letter-spacing:.03em}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ctry{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cc{border-radius:14px;padding:12px;background:var(--c-soft);border:1.5px solid transparent;display:grid;gap:4px;min-width:0}
.cc .flag{font-size:22px;line-height:1}
.cc .nm{font-weight:700;font-size:13px}
.cc .rev{font-family:var(--f-display);font-size:22px;line-height:1.1;word-break:break-word;font-variant-numeric:tabular-nums}
.cc .cur{font-size:11px;font-weight:700;color:var(--c)}
.cc .sub{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi .v{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--muted);margin-top:3px}
.sec{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.bar{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.track{height:14px;border-radius:7px;background:var(--line);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.prod{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.prod:first-of-type{border-top:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.search{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.order{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.order{min-width:0;max-width:100%}
.order>*{min-width:0}
.order .meta,.order .addr{overflow-wrap:anywhere}
.order .row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline;min-width:0}
.order .nm{flex:1 1 auto;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order .pr{flex:0 0 auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
html,body{overflow-x:hidden;overscroll-behavior:none}
.app{max-width:min(600px,100vw)}
.order .meta{font-size:12px;color:var(--muted)}
.order .addr{font-size:12px;color:var(--muted);word-break:break-word}
.tog{display:flex;gap:6px;flex-wrap:wrap}
.tg{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.tg.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.tg.off{background:var(--warn-soft)}
.tg.pend{opacity:.6}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:13px;font-weight:600}
.form input,.form select,.form textarea{padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;width:100%}
.form textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cbtn{border-radius:12px;padding:10px 6px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:13px;display:grid;justify-items:center;gap:2px}
.cbtn span{font-size:20px}
.cbtn[aria-pressed="true"]{border-color:var(--c);background:var(--c-soft)}
.total{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:12px;background:var(--bg);font-weight:700}
.total b{font-family:var(--f-display);font-size:26px;font-weight:400}
.btn{font:700 15px var(--f-body);background:var(--ink);color:var(--surface);border:0;border-radius:12px;padding:13px 16px;cursor:pointer;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;padding:10px 12px;border-radius:12px}
.msg.ok{background:var(--good-soft)} .msg.err{background:var(--bad-soft)}
.stock{border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.stock table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.stock th,.stock td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
.stock th:first-child,.stock td:first-child{text-align:left}
.stock caption{text-align:left;font-weight:700;padding:10px 10px 4px}
.stock tr:last-child td{border-bottom:0}
.empty{padding:24px 10px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-size:16px}
.banner{padding:10px 12px;border-radius:12px;font-size:13px;background:var(--bad-soft);display:flex;gap:10px;align-items:center;justify-content:space-between}
.sbtn{font:700 13px var(--f-body);background:var(--ink);color:var(--surface);border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
.pr-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.pr-row:first-child{border-top:0}
.pr-row .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.pr-row .s{grid-column:1/-1;font-size:12px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--us)}
.warn{padding:10px 12px;border-radius:12px;font-size:13px;background:var(--warn-soft);display:grid;gap:4px}
.hero{display:grid;gap:4px;padding:6px 0 4px}
.hero .lbl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.hero .num{font-family:var(--f-display);font-size:48px;font-weight:400;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.hero .sub{font-size:14px;color:var(--muted)}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:2px}
.seg button{border:0;background:none;font:600 12px var(--f-body);padding:4px 10px;border-radius:999px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.list{display:grid}
.li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;font:inherit;color:inherit}
.li:first-child{border-top:0}
button.li{cursor:pointer}
.li .ic{font-size:20px;width:28px;text-align:center}
.li .t{font-weight:600;font-size:15px}.li .s{font-size:12px;color:var(--muted)}
.li .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.li .v small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.cnt{display:inline-block;min-width:26px;padding:2px 8px;border-radius:999px;background:var(--soft);font-weight:700;text-align:center}
.cnt.hot{background:var(--ink);color:var(--surface)}
.fix{border:0;background:var(--warn-soft);border-radius:12px;padding:10px 12px;font:600 13px var(--f-body);text-align:left;cursor:pointer;color:var(--ink)}
.more{border:1px solid var(--line);background:none;border-radius:12px;padding:12px;font:600 14px var(--f-body);cursor:pointer;color:var(--ink)}
.big{font-family:var(--f-display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.modetabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px}
.modetabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 8px;cursor:pointer;display:grid;gap:2px;text-align:center;color:var(--ink);font:inherit}
.modetabs button b{font-size:14px;font-weight:700}
.modetabs button small{font-size:10px;color:var(--muted);line-height:1.2}
.modetabs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.modetabs button[aria-pressed="true"] small{color:rgba(255,255,255,.7)}

/* pop-in */

/* day pop-out */

<script>
/* Lets the Claude-built app run on any website: Firebase = shared database + Google login,
   Apps Script = Google Sheets access. The app code itself is unchanged. */
(function(){
  if (window.__DEMO__) return;
  const C = window.APP_CONFIG;
  firebase.initializeApp(C.firebase);
  const auth = firebase.auth(), fs = firebase.firestore();
  let user = null, resolveReady;
  const ready = new Promise(r => resolveReady = r);

  // ---- login screen ----
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;z-index:99999;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font:16px -apple-system,sans-serif;text-align:center;padding:24px";
  ov.innerHTML = '<div style="font-size:22px;font-weight:700">Opposight Sales</div><div id="lmsg" style="opacity:.8">Sign in to continue</div><button id="lbtn" style="font-size:16px;padding:12px 22px;border-radius:10px;border:0;background:#fff;color:#111;font-weight:600">Sign in with Google</button>';
  const mount = () => { if (!ov.isConnected) document.body.appendChild(ov) };
  if (document.body) mount(); else document.addEventListener("DOMContentLoaded", mount);
  const msg = t => { const m = ov.querySelector("#lmsg"); if (m) m.textContent = t };
  ov.addEventListener("click", async e => {
    if (e.target.id !== "lbtn") return;
    const p = new firebase.auth.GoogleAuthProvider();
    try { await auth.signInWithPopup(p) } catch (err) { try { await auth.signInWithRedirect(p) } catch (e2) { msg("Sign-in failed: " + e2.message) } }
  });

  auth.onAuthStateChanged(async u => {
    if (!u) { user = null; ov.style.display = "flex"; return }
    try {   // rules only allow listed emails – this write fails for anyone else
      await fs.collection("users").doc(u.uid).set({ name: u.displayName || u.email, email: u.email });
      user = u; ov.style.display = "none"; resolveReady();
    } catch (err) {
      msg(u.email + " is not allowed. Ask May to add it.");
      auth.signOut();
    }
  });

  // ---- services the app asks for ----
  const services = {
    db: fs,
    user: {
      me: async () => ({ id: user.uid, name: user.displayName || user.email }),
      can: async () => true,
      profiles: async ids => {
        const out = {};
        await Promise.all(ids.map(async id => { try { const d = await fs.collection("users").doc(id).get(); if (d.exists) out[id] = { name: d.data().name } } catch (e) {} }));
        return out;
      }
    },
    mcp: (() => {
      const callTool = async (server, tool, args) => {
        const token = await user.getIdToken();
        const r = await fetch(C.appsScriptUrl, { method: "POST", body: JSON.stringify({ token, key: C.firebase.apiKey, tool, args }) });
        const j = await r.json();
        if (j.error) { const e = new Error(j.error); e.code = "tool_error"; e.m = j.error; throw e }
        return j;
      };
      const watchers = [], key = (t, i) => t + "|" + JSON.stringify(i);
      const watchTool = (server, tool, input, cb, opts) => {
        const w = { k: key(tool, input) };
        w.run = async () => {
          try { const r = await callTool(server, tool, input); cb({ type: "data", result: { payload: r.payload, cache: { storedAt: Date.now() } } }) }
          catch (e) { if (!e.code) { e.code = "server_unavailable" } cb({ type: "error", error: e }) }
        };
        watchers.push(w); w.run();
        const ms = (opts && opts.refetchInterval) || 0;
        if (ms) w.t = setInterval(w.run, ms);
        return () => { clearInterval(w.t); const i = watchers.indexOf(w); if (i >= 0) watchers.splice(i, 1) };
      };
      const invalidate = (server, tool, input) => { const k = key(tool, input); watchers.filter(w => w.k === k).forEach(w => w.run()); return Promise.resolve() };
      return { callTool, watchTool, invalidate };
    })(),
    downloads: {
      save: async ({ filename, data }) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(data); a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
      }
    }
  };
  window.claude = { use: async n => { await ready; return services[n] || null } };
})();

</script>

function rowToOrder(tabName,r,v){

}

async function applyEdits(){

 if(applying){applyAgain=true;return}
 applying=true;
 try{
  for(const e of edits.slice()){
   if(e.type==="po"||e.type==="exp"){
    if(e.type==="po"&&!liveTab)continue;if(e.type==="exp"&&!liveFin)continue;
    const ref=db.doc("edits/"+e.id);let lease;try{lease=await ref.acquire({holder:TAB_ID,ttlMs:30000})}catch(err){continue}
    if(!lease||!lease.acquired)continue;const cur=await ref.get();if(!cur.exists)continue;
    try{
     if(e.type==="po"){const ex=parsePOTab(liveTab).find(x=>x.id===e.pid);
      if(e.del){if(ex){await mcp.callTool(SERVER,"update_values",{spreadsheetId:SHEET,range:"'Purchase Orders'!A"+ex.row+":J"+ex.row,values:[["","","","","","","","","",""]]});liveTab[ex.row-1]=[];}}
      else{const f=Object.assign({},ex||{},e.fields||{},{id:e.pid});await sheetPOWrite(f,ex?ex.row:Math.max(2,liveTab.length+1));}
      await writeMirror("potab",liveTab);mcp.invalidate(SERVER,"get_values",poTabInput).catch(()=>{});
     } else {
      let r=3;while(r<liveFin.length&&((liveFin[r]||[]).slice(14,20).some(x=>trim(x))))r++;
      await mcp.callTool(SERVER,"update_values",{spreadsheetId:SHEET,range:"'Finance'!O"+(r+1)+":T"+(r+1),values:[e.vals]});
      while(liveFin.length<=r)liveFin.push([]);const row=(liveFin[r]||[]).slice();while(row.length<20)row.push("");e.vals.forEach((v,k)=>row[14+k]=String(v));liveFin[r]=row;
      await writeMirror("finance",liveFin);mcp.invalidate(SERVER,"get_values",finInput).catch(()=>{});
     }
     await ref.delete();
    }catch(err){}
    continue;
   }
   if(!liveRaw[e.tab])continue;
   const ref=db.doc("edits/"+e.id);
   let lease;try{lease=await ref.acquire({holder:TAB_ID,ttlMs:30000})}catch(err){continue}
   if(!lease||!lease.acquired)continue;
   const cur=await ref.get();if(!cur.exists)continue;
   try{
    if(e.type==="cell"){
     await mcp.callTool(SERVER,"update_values",{spreadsheetId:SHEET,range:"'"+e.tab+"'!"+colA1(e.c)+(e.r+1),values:[[e.val]]});
     const raw=liveRaw[e.tab];if(raw[e.r]){raw[e.r]=raw[e.r].slice();while(raw[e.r].length<=e.c)raw[e.r].push("");raw[e.r][e.c]=e.val===true?"TRUE":e.val===false?"FALSE":e.val}
    } else if(e.type==="order"){
     const dd=parseDrop(e.tab,liveRaw[e.tab]);const row=dd.next;const vals=(e.vals||[]).slice();vals[0]=String(dd.rows.length+1);
     await mcp.callTool(SERVER,"update_values",{spreadsheetId:SHEET,range:"'"+e.tab+"'!B"+(row+1)+":N"+(row+1),values:[vals]});
     const raw=liveRaw[e.tab];while(raw.length<=row)raw.push([]);raw[row]=[""].concat(vals.map(x=>x===false?"FALSE":x===true?"TRUE":x));
    }
    await writeMirror(keyOf(e.tab),liveRaw[e.tab]);
    await ref.delete();
    mcp.invalidate(SERVER,"get_values",inputFor(e.tab)).catch(()=>{});
   }catch(err){/* leave it queued; the lease lapses and a later pass retries */}
  }
 } finally{applying=false;render();if(applyAgain){applyAgain=false;setTimeout(applyEdits,1500)}}
}

async function scaleImg(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",q))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)});}

function gapContent(){
 const rows=liveSC||mirrorSC;
 if(!rows)return '<div class="empty"><b>No Stock Check yet</b><p>The Stock Check tab in the Google Sheet feeds this.</p></div>';
 const items=[];
 for(let r=0;r<rows.length;r++){const x=rows[r]||[];const nm=trim(x[0]),b=trim(x[1]),fin=trim(x[11]);
  if(!nm||/product/i.test(nm)||!/^\d/.test(b)||fin==="")continue;
  items.push({nm,bulk:num(x[1]),gift:num(x[2]),mm:num(x[3]),th:num(x[4]),us:num(x[5]),logged:num(x[6]),reseller:num(x[10]),fin:num(x[11])});
 }
 let miss=0,extra=0;items.forEach(i=>{if(i.fin>0)miss+=i.fin;else extra+=-i.fin;});
 let h='<div style="margin-top:6px"><div class="eyebrow">bought = gift + sold + reseller + stock + gap</div><div class="h2">Gap check</div></div>';
 if(!items.length)return h+'<div class="empty"><b>Nothing to show</b><p>Fill the Stock Check tab.</p></div>';
 h+='<div class="kpis"><div class="kpi"><div class="v '+(miss?"neg":"pos")+'">'+miss+'</div><div class="k">still missing</div></div><div class="kpi"><div class="v">'+extra+'</div><div class="k">extra pieces</div></div><div class="kpi"><div class="v">'+items.length+'</div><div class="k">products checked</div></div></div>';
 h+='<div class="list">'+items.map(i=>{
  const f=i.fin;let tag,cls;
  if(f>0){tag=f+" missing";cls="neg";}else if(f<0){tag=(-f)+" extra";cls="pos";}else{tag="✓ ok";cls="pos";}
  const stock=i.mm+i.th+i.us;
  return '<div class="li" style="grid-template-columns:1fr auto"><span><span class="t">'+esc(i.nm)+'</span><br><span class="s">bought '+i.bulk+' · gift '+i.gift+' · sold '+i.logged+' · reseller '+i.reseller+' · in stock '+stock+'</span></span><span class="v '+cls+'">'+tag+'</span></div>';
 }).join("")+'</div>';
 h+='<p class="s" style="font-size:12px;color:var(--muted)"><b>Missing</b> = bought but not yet accounted for — recheck. <b>Extra</b> = reseller took more than the gap (usually extra re-orders). Edit the numbers in the Stock Check tab of the sheet.</p>';
 return h;
}

function autoMatch(p){

 let best=null,bs=0,tie=false;
 ALLD.forEach(id=>{let sc=0;const n=parseInt(id.slice(1),10);
  if(new RegExp("\\bdrop\\s*0*"+n+"\\b").test(t)||t.includes(" d"+pad2(n)+" "))sc+=10;
  const nm=String(DNAME[id]||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  if(nm&&t.includes(" "+nm+" "))sc+=6;

}

function dropStats(){

function dataNotes(){const P=computeProfit(),n=[];if(!P.has)n.push("Finance tab not loaded: no purchase quantities or costs.");

function statsKey(S){return S.map(s=>[s.drop_id,s.bought,s.sold,s.sales,s.net].join(":")).join("|")}
function whyInsights(S){
 const has=S.filter(s=>s.sold>0);if(!has.length)return null;
 const best=k=>has.filter(s=>s[k]!=null&&isFinite(s[k])).sort((a,b)=>b[k]-a[k])[0];
 const avg=(k,arr)=>{const v=arr.map(s=>s[k]).filter(x=>x!=null&&isFinite(x));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
 const M=n=>fmt(n)+" MMK",PC=x=>(x*100).toFixed(1)+"%",B=s=>"<b>"+esc(s.label)+"</b>";
 const f1=best("sell_through"),f2=best("sales"),f3=best("net"),out={fast:[],profit:[],slow:[],next:[]};
 const withB=S.filter(s=>s.bought>0),minB=withB.length?Math.min.apply(null,withB.map(s=>s.bought)):0,avgB=avg("bought",withB),avgP=avg("avg_price_per_piece",has);
 const topC=s=>Object.entries(s.by_country||{}).sort((a,b)=>b[1]-a[1])[0];
 if(f1){out.fast.push(B(f1)+" sold "+f1.sold+" of "+f1.bought+" pieces ("+PC(f1.sell_through)+"), the highest share of any drop.");
  if(withB.length>1&&f1.bought===minB)out.fast.push("It was your smallest run ("+f1.bought+" pieces), so every sale moves the % up faster.");
  else if(avgB&&f1.bought<avgB)out.fast.push("Its run ("+f1.bought+" pieces) is smaller than an average drop ("+Math.round(avgB)+").");
  if(f1.avg_price_per_piece&&avgP&&f1.avg_price_per_piece<avgP*.95)out.fast.push("Its price per piece ("+M(f1.avg_price_per_piece)+") is below the average ("+M(avgP)+"), which helps it sell.");
  if(f1.days_on_sale!=null)out.fast.push("It has been on sale for "+f1.days_on_sale+" days.");else if(S.indexOf(f1)===0&&S.length>1)out.fast.push("It's your oldest drop, so it has had the most time to sell.");
  const tc=topC(f1);if(tc)out.fast.push("Most pieces went to "+esc(tc[0])+" ("+tc[1]+" pcs)"+(f1.top_products[0]?", best seller: "+esc(f1.top_products[0]):"")+".")}
 if(f3){out.profit.push(B(f3)+" kept "+M(f3.net)+" net: "+M(f3.sales)+" sales − "+M(f3.product_cost)+" product cost − "+M(f3.expenses)+" expenses"+(f3.gifts_damaged?" − "+M(f3.gifts_damaged)+" gifts/damaged":"")+".");
  if(f3.margin!=null)out.profit.push("It keeps "+PC(f3.margin)+" of every sale as profit"+(f3.cost_per_piece?" (cost per piece "+M(f3.cost_per_piece)+")":"")+".");
  if(f2&&f2!==f3){const why=[];if(f2.expenses>f3.expenses)why.push("higher expenses ("+M(f2.expenses)+" vs "+M(f3.expenses)+")");if(f2.cost_per_piece&&f3.cost_per_piece&&f2.cost_per_piece>f3.cost_per_piece)why.push("higher cost per piece ("+M(f2.cost_per_piece)+" vs "+M(f3.cost_per_piece)+")");if(f2.gifts_damaged>f3.gifts_damaged)why.push("more gifts/damaged pieces");
   out.profit.push(B(f2)+" sold more ("+M(f2.sales)+") but kept less ("+M(f2.net)+")"+(why.length?" because of "+why.join(" and "):"")+".")}}
 const cut=Math.max(.2,f1&&f1.sell_through?f1.sell_through/2:0),newest=S[S.length-1];
 S.filter(s=>s.bought>0&&(s.sell_through||0)<cut&&s!==f1).sort((a,b)=>(a.sell_through||0)-(b.sell_through||0)).forEach(s=>{
  const r=[];if(f1&&f1.bought&&s.bought>=f1.bought*1.8)r.push("it's "+(s.bought/f1.bought).toFixed(1)+"× bigger than "+esc(f1.label)+", so it needs much longer to sell");
  if(s===newest&&S.length>1)r.push("it's your newest drop, so it has had the least time");
  if(s.days_on_sale!=null&&s.days_on_sale<30)r.push("it has only been on sale "+s.days_on_sale+" days");
  if(s.avg_price_per_piece&&avgP&&s.avg_price_per_piece>avgP*1.1)r.push("its price per piece ("+M(s.avg_price_per_piece)+") is above average");
  if(s.unpaid_orders)r.push(s.unpaid_orders+(s.unpaid_orders===1?" order isn't":" orders aren't")+" paid yet, so "+(s.unpaid_orders===1?"it doesn't":"they don't")+" count");
  out.slow.push(B(s)+": bought "+s.bought+", sold only "+s.sold+" ("+PC(s.sell_through||0)+"). "+(s.bought-s.sold)+" pieces still waiting"+(s.unsold_stock_value?" (≈ "+M(s.unsold_stock_value)+" of stock)":"")+"."+(r.length?" Probably because "+r.join("; ")+".":""))});
 if(!out.slow.length)out.slow.push("No drop is far behind the others right now.");
 if(f1)out.next.push("Keep "+B(f1)+" in front of fans. It's limited, so post \"only "+Math.max(0,f1.left)+" left\" updates"+(f1.top_sizes[0]?" (best size: "+esc(f1.top_sizes[0])+")":"")+" to create urgency.");
 S.filter(s=>s.bought>0&&(s.sell_through||0)<cut&&s!==f1).forEach(s=>out.next.push("Push "+B(s)+" with TikTok/Instagram content, a bundle or a small discount to sell the "+Math.max(0,s.left)+" pieces left."));
 has.filter(s=>s.margin!=null&&s.margin<.15).forEach(s=>out.next.push(s.margin<0?B(s)+" is losing money so far ("+M(s.net)+"). Sell the stock before spending more on it.":B(s)+" keeps only "+PC(s.margin)+" profit. Raise the price or cut its expenses."));

}

async function streamAI(st,focus,onText){
 const url=aiEndpoint();if(!url){st.err="AI isn't connected on this site yet.";return}

 if(window.__DEMO__)headers["X-Opposight-Demo"]="1";
 else{try{const u=window.firebase&&firebase.auth().currentUser;if(u)headers.Authorization="Bearer "+await u.getIdToken()}catch(e){}}
 Object.assign(st,{text:"",busy:true,err:"",key:statsKey(S),at:0});onText(true);
 try{const r=await fetch(url,{method:"POST",headers,body:JSON.stringify({currency:"MMK",today:localISO(new Date()),drops:S,data_notes:dataNotes(),focus_drop:focus||null})});
  if(!r.ok){let m="";try{m=(await r.json()).detail}catch(e){}throw new Error(typeof m==="string"&&m?m:"AI request failed ("+r.status+")")}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
  for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
   while((i=buf.indexOf("\n\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+2);if(!line.startsWith("data:"))continue;const ev=JSON.parse(line.slice(5));
    if(ev.error)throw new Error(ev.error);if(ev.t){const first=!st.text;st.text+=ev.t;onText(first)}}}
  if(!st.text)throw new Error("The AI returned nothing. Try again.");st.at=Date.now();
 }catch(e){st.err=(e&&e.message)||"AI request failed."}
 st.busy=false;
}

var dpOpen=null,dpAI={};
var fmtS=n=>{const a=Math.abs(n);return (n<0?"-":"")+(a>=1e6?(a/1e6).toFixed(a>=1e7?0:1)+"M":a>=1e3?Math.round(a/1e3)+"K":String(Math.round(a)))};
function rankOf(S,s,k){const L=S.filter(x=>x[k]!=null&&isFinite(x[k])&&x.sold>0).sort((a,b)=>b[k]-a[k]);const i=L.indexOf(s);return i<0?null:i+1}
function dropInsight(s,S){
 const M=n=>fmt(n)+" MMK",PC=x=>(x*100).toFixed(1)+"%",has=S.filter(x=>x.sold>0);
 const avg=k=>{const v=has.map(x=>x[k]).filter(x=>x!=null&&isFinite(x));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
 const aSt=avg("sell_through"),aM=avg("margin"),aP=avg("avg_price_per_piece"),good=[],bad=[],todo=[],st=s.sell_through||0;
 const rs=rankOf(S,s,"sell_through"),rn=rankOf(S,s,"net");
 if(rs===1&&has.length>1)good.push("Fastest seller of all drops ("+PC(st)+" sold).");else if(aSt!=null&&st>aSt)good.push("Sells faster than the average drop ("+PC(st)+" vs "+PC(aSt)+").");
 if(rn===1&&has.length>1)good.push("Best profit of all drops ("+M(s.net)+").");else if(s.margin!=null&&aM!=null&&s.margin>aM&&s.margin>0)good.push("Keeps more of each sale than average ("+PC(s.margin)+" vs "+PC(aM)+").");
 const tc=Object.entries(s.by_country||{}).sort((a,b)=>b[1]-a[1]);if(tc[0])good.push("Strongest in "+esc(tc[0][0])+" ("+tc[0][1]+" pcs)"+(tc.length>1?", then "+tc.slice(1).map(x=>esc(x[0])+" "+x[1]).join(", "):"")+".");
 if(s.top_sizes[0])good.push("Best sizes: "+s.top_sizes.map(esc).join(", ")+(s.top_colors.length>1?" · colours: "+s.top_colors.map(esc).join(", "):"")+".");
 if(aSt!=null&&st<aSt*.6&&s.bought)bad.push("Selling slower than average ("+PC(st)+" vs "+PC(aSt)+").");
 const minB=Math.min.apply(null,S.filter(x=>x.bought>0).map(x=>x.bought).concat([Infinity]));
 if(s.bought&&minB<Infinity&&s.bought>=minB*1.8)bad.push("Big run: "+s.bought+" pieces ("+(s.bought/minB).toFixed(1)+"× your smallest drop), so it naturally takes longer to sell.");
 if(s.avg_price_per_piece&&aP&&s.avg_price_per_piece>aP*1.1)bad.push("Price per piece ("+M(s.avg_price_per_piece)+") is above average ("+M(aP)+").");
 const unit=s.avg_price_per_piece&&s.cost_per_piece?s.avg_price_per_piece-s.cost_per_piece:null;
 if(s.net<0){const need=unit>0?Math.ceil(-s.net/unit):null;bad.push("Losing money so far ("+M(s.net)+")."+(need!=null?" About "+need+" more pieces at today's average price would break even"+(s.left?" ("+s.left+" left)":"")+".":""))}
 if(s.unpaid_orders)bad.push(s.unpaid_orders+(s.unpaid_orders===1?" order isn't":" orders aren't")+" paid yet (not counted in sales).");
 if(!s.bought)bad.push("No purchase quantity in the Finance tab, so speed can't be worked out.");
 if(s.left===0&&s.bought)todo.push("Sold out. Use its photos and reviews to hype your other drops.");
 else if(st>=.8)todo.push("Almost gone. Post \"last "+s.left+" pieces\" stories to finish it.");
 else if(s.left){todo.push("Sell the "+s.left+" pieces left: TikTok/Instagram try-ons"+(s.top_sizes[0]?" (lead with size "+esc(s.top_sizes[0].split(" ")[0])+")":"")+", customer photos, live sessions.");
  if(st<.3)todo.push("Try a bundle with a faster drop, or a small discount on slow sizes and colours.");
  if(tc.length&&tc.length<3)todo.push("Test it in another country: so far it sold only in "+tc.map(x=>esc(x[0])).join(" and ")+".")}
 if(s.unpaid_orders)todo.push("Follow up on the "+s.unpaid_orders+" unpaid "+(s.unpaid_orders===1?"order":"orders")+".");
 return {good,bad,todo,rs,rn,rv:rankOf(S,s,"sales")};
}
function dataChecks(S){
 const P=computeProfit(),out=[],T=sheetTabs||[];
 const po=T.filter(t=>/purchase\s*orders?/i.test(t));if(po.length>1)out.push(["warn","There are "+po.length+" Purchase Orders tabs ("+po.map(esc).join(", ")+"). The app only reads \"Purchase Orders\". Delete or rename the other one."]);
 if(P.miss.rates.size)out.push(["warn","Missing exchange rates in the Finance tab: "+Array.from(P.miss.rates).slice(0,5).map(esc).join(", ")+"."]);
 if(P.miss.unmatchedN)out.push(["warn",P.miss.unmatchedN+" paid orders use a product/colour name that isn't in the Finance tab, so their cost is unknown. Use the exact same names."]);
 const nc=P.items.filter(i=>i.landedUnit==null).length;if(nc)out.push(["warn",nc+" Finance product rows have no cost per piece."]);
 S.forEach(s=>{if(s.sold>s.bought&&s.bought)out.push(["warn","<b>"+esc(s.label)+"</b>: sold ("+s.sold+") is more than bought ("+s.bought+"). Check the Finance quantity."]);if(!s.bought)out.push(["warn","<b>"+esc(s.label)+"</b> has no purchase quantity in the Finance tab."])});
 if(Array.isArray(POS)&&POS.length&&typeof poDropOf==="function"){const q={};POS.forEach(p=>{const d=poDropOf(p);if(d&&Number(p.qty)>0)q[d.id]=(q[d.id]||0)+Number(p.qty)});
  S.forEach(s=>{if(q[s.drop_id]&&s.bought&&q[s.drop_id]!==s.bought)out.push(["warn","<b>"+esc(s.label)+"</b>: Finance says "+s.bought+" pieces bought, purchase orders say "+q[s.drop_id]+". One of them is probably wrong."])})}
 const up=S.reduce((a,s)=>a+s.unpaid_orders,0);if(up)out.push(["info",up+" orders are not marked Paid, so they're not counted in sales or profit."]);
 if(!allOrders().some(o=>o.date))out.push(["info","No order dates yet. New orders saved from the app now get a date in column O (\"Order Date\"). Type dates for older orders in column O to see how many days each drop takes to sell."]);
 return out;
}
function dropCards(S){
 return '<div class="sec" style="margin-top:4px">Drop reports · tap one</div><div class="dcards" data-testid="compare-drop-cards">'+S.map(s=>{const st=s.sell_through;return '<button type="button" class="dcard" data-drep="'+esc(s.drop_id)+'" data-testid="compare-drop-card-'+esc(s.drop_id)+'"><span class="k">'+esc(s.label)+(s.name?' · '+esc(s.name):'')+'</span><span class="v">'+(st==null?"–":(st*100).toFixed(1)+"%")+'<small> sold</small></span><span class="dbar"><i style="width:'+Math.min(100,Math.round((st||0)*100))+'%"></i></span><span class="s">'+fmtS(s.sales)+' sales · <b class="'+(s.net<0?'neg':'')+'">'+fmtS(s.net)+'</b> net</span></button>'}).join("")+'</div>'}
function dataCheckBox(S){const C=dataChecks(S);return '<div class="box" data-testid="compare-data-check"><div class="sec">Data check (things that look messy)</div>'+C.map(([k,t])=>'<div class="dchk '+k+'">'+(k==="warn"?"⚠️":"ℹ️")+' <span>'+t+'</span></div>').join("")+'</div>'}
function dpopEl(){let el=document.getElementById("droppop");if(!el){el=document.createElement("div");el.id="droppop";el.style.cssText="position:relative;z-index:60";document.body.appendChild(el)}return el}

 h+='<div class="dstats">'+card("Sell-through",st==null?"–":(st*100).toFixed(1)+"%",s.sold+" of "+s.bought+" pieces · "+s.left+" left")+card("Sales",M(s.sales),s.avg_price_per_piece?"avg "+fmt(s.avg_price_per_piece)+" / piece":"no paid sales")+card("Net profit",M(s.net),s.margin!=null?"margin "+(s.margin*100).toFixed(1)+"%":"–","wide"+(s.net<0?" neg":""))+'</div>';
 h+='<div class="dcost">Product cost '+fmtS(s.product_cost)+' · Expenses '+fmtS(s.expenses)+(s.gifts_damaged?' · Gifts/damaged '+fmtS(s.gifts_damaged):'')+(s.unsold_stock_value?' · Unsold stock ≈ '+fmtS(s.unsold_stock_value):'')+'</div>';
 h+=list("👍 Going well",I.good,"good")+list("👎 Holding it back",I.bad,"bad")+list("✅ What to do next",I.todo,"todo");
 h+='<div class="aibox dpai" data-testid="drop-pop-ai"><div class="aihead"><div><div class="sec">✦ AI on this drop</div><div class="aisub">Claude compares '+esc(s.label)+' with your other drops.</div></div><button type="button" class="sbtn" data-dpop="ai" data-testid="drop-pop-ai-button"'+(ai.busy?' disabled':'')+'>'+(ai.busy?'Analysing…':ai.text?'Re-analyse':'Analyse')+'</button></div>'+(ai.busy&&!ai.text?'<div class="aithink"><i></i><i></i><i></i> Reading this drop…</div>':'')+'<div class="aiout" id="dpaiout" data-testid="drop-pop-ai-output">'+aiMd(ai.text||"")+'</div>'+(ai.err?'<div class="warn">'+esc(ai.err)+'</div>':'')+'</div>';
 const sc=el.querySelector(".calpop"),top=sc?sc.scrollTop:0;
 el.innerHTML='<div class="calov'+(anim?' in':'')+'" data-dpop="close"></div><div class="calpop dpop'+(anim?' in':'')+'" role="dialog" aria-modal="true" aria-label="Drop report" data-testid="drop-report-popup">'+h+'</div>';
 const ns=el.querySelector(".calpop");if(ns&&!anim)ns.scrollTop=top;
}
function closeDropPop(){const el=dpopEl();el.querySelectorAll(".calov,.calpop").forEach(x=>x.classList.add("out"));setTimeout(()=>{dpOpen=null;el.innerHTML=""},170)}
document.addEventListener("click",async e=>{const r=e.target.closest&&e.target.closest("[data-drep]");if(r&&r.dataset.drep){dpOpen=r.dataset.drep;renderDropPop(true);return}

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&dpOpen)closeDropPop()});

/* ---------- AI helpers: chat/screenshot -> order draft, payment slip -> mark Paid ---------- */

var extractUrl=()=>aiEndpoint().replace(/drop-analysis$/,"ai-extract");
async function aiPost(body){
 const headers={"Content-Type":"application/json"};
 if(window.__DEMO__)headers["X-Opposight-Demo"]="1";
 else{try{const u=window.firebase&&firebase.auth().currentUser;if(u)headers.Authorization="Bearer "+await u.getIdToken()}catch(e){}}
 const r=await fetch(extractUrl(),{method:"POST",headers,body:JSON.stringify(body)});
 let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok)throw new Error((j&&typeof j.detail==="string"&&j.detail)||"AI request failed ("+r.status+")");return j}

 if(p)h+=aiSL.matches.length?'<div class="setlbl">Matching unpaid orders</div>'+aiSL.matches.map((m,i)=>'<div class="slipm'+(m.mine?' mine':'')+'" data-testid="payment-slip-match-'+i+'"><div><b>'+(m.mine?'This order · ':'')+esc(m.o.name||"(no name)")+'</b><small>'+esc(m.o.drop)+' · '+esc(m.o.product)+' '+esc(m.o.color)+' · '+esc(m.o.price)+' · total '+fmt(m.o.total)+'</small><small>'+esc(m.why)+'</small></div><button type="button" class="sbtn" data-aipaid="'+esc(m.o.tab)+'|'+m.o.r+'" data-testid="payment-slip-mark-paid-'+i+'">Mark Paid</button></div>').join(""):'<div class="cempty">No unpaid order matches this amount. Check the Orders tab.</div>';
 return h+'</div>'}
function slipMatches(p){
 const toks=s=>String(s||"").toLowerCase().split(/[^a-z0-9\u1000-\u109f]+/).filter(x=>x.length>1);
 const st=new Set(toks(p.sender));
 return allOrders().filter(o=>!o.queued&&o.r>=0&&!isPaid(cellVal(o,11,o.status))).map(o=>{let sc=0;const why=[];
  const cur=curOf(o);if(p.currency&&cur!==p.currency)return null;
  if(p.amount!=null&&o.total){const d=Math.abs(o.total-p.amount)/Math.max(1,o.total);if(d<.001){sc+=3;why.push("same amount")}else if(d<.03){sc+=2;why.push("almost same amount")}}
  if(toks(o.name).some(t=>st.has(t))){sc+=2;why.push("name matches")}
  if(p.method&&o.pay&&o.pay.toLowerCase().replace(/\s/g,"")===p.method.toLowerCase().replace(/\s/g,"")){sc+=1;why.push("same payment method")}
  return sc>=2?{o,sc,why:why.join(", ")}:null}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,3)}
function applyDraft(d){
 const ctry=["MM","TH","US"].includes(d.country)?d.country:form.country,c=C[ctry];
 const pick=(v,list)=>{const s=String(v||"").toLowerCase().replace(/\s/g,"");return list.find(x=>x.toLowerCase().replace(/\s/g,"")===s)||list.find(x=>s&&x.toLowerCase().includes(s))||list[0]};
 Object.assign(form,{country:ctry,name:d.name||form.name,addr:d.address||form.addr,product:d.product||form.product,color:d.color||form.color,size:d.size||form.size,qty:Math.max(1,parseInt(d.qty,10)||1),pay:pick(d.payment,c.pay),deli:pick(d.delivery,c.deli),paid:!!d.paid});
 if(d.price>0)form.price=d.price;
 const lc=x=>String(x||"").toLowerCase().trim(),hit=DROPS.map(dr=>{const dd=dropData(dr.tab),rows=dd?dd.rows:[];return {dr,rows,n:rows.filter(o=>lc(o.product)===lc(form.product)&&(!form.color||lc(o.color)===lc(form.color))).length}}).sort((a,b)=>b.n-a.n)[0];
 if(hit&&hit.n){form.drop=hit.dr.tab;if(!(d.price>0)){const same=hit.rows.filter(o=>lc(o.product)===lc(form.product)&&o.ctry===ctry&&o.total&&o.qty);const last=same[same.length-1];
  const pp=last?Math.round(last.total/last.qty):(PRICES[form.product]||{})[ctry];if(pp)form.price=pp}}
}
